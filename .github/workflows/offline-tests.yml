name: offline-tests

# Runs every test that needs NO ROS master and NO robot: map/ICP/tier math, the navigation
# state machine (rospy and tf are stubbed), costmap + A* + DWA, and the closed-loop acceptance
# scenarios in the synthetic sim room.  ROS-level checks (catkin build, launch files, headless
# simulation) are done on the robot PC with tools/ab_preflight.sh and tools/cd_preflight.sh.

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install python deps
        run: python -m pip install --upgrade pip numpy scipy pyyaml
      - name: Byte-compile everything
        run: python -m compileall -q slam navigation tools
      - name: Launch files and package manifests are well-formed XML
        run: |
          python - <<'PY'
          import glob, xml.dom.minidom as m
          files = glob.glob("**/*.launch", recursive=True) + glob.glob("*/package.xml")
          files = [f for f in files if "g1_ws/src/fast_lio" not in f and __import__("os").path.getsize(f) > 0]
          for f in files:
              m.parse(f)
          print("parsed", len(files), "files")
          PY
      - name: YAML configs parse
        run: |
          python - <<'PY'
          import glob, yaml
          for f in glob.glob("navigation/config/*.yaml") + glob.glob("slam/config/*.yaml") + ["navigation/rviz/navigation.rviz"]:
              yaml.safe_load(open(f))
          print("yaml ok")
          PY
      - name: slam tests (ICP relocalization, PCD io, tiers, hole filling)
        working-directory: slam
        run: PYTHONPATH=src python -m unittest discover -s test -p "test_*.py" -v
      - name: navigation tests (state machine, costmap, planner, DWA, sim room acceptance)
        working-directory: navigation/test
        run: python -m unittest test_navigation_node test_costmap_planner_dwa test_sim_room test_robustness test_launch_files test_slam_nav_contract test_joint_bridge_table test_section_e test_section_g test_locomotion_bridge -v
      - name: sim map generator is reproducible
        run: |
          python tools/make_sim_map.py
          git diff --exit-code navigation/sim/sim_room
