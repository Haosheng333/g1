# auto_release_monitor parameters. Loaded into the node's private namespace by
# launch/auto_release_monitor.launch; launch args win over this file.
#
# OUT OF THE BOX THIS DETECTOR IS NOT_READY, deliberately. One thing is
# missing and it may not be guessed: the SDK force schema (tactile.* below).
# Until channels are declared there is nothing for a threshold to apply to.
#
# The DETECTION RULE is the consecutive-frame rule (requested 2026-10-14):
# each valid frame is compared with the one before it, per channel; if ANY
# enabled channel's delta passes its threshold one release request is produced;
# if none does, that frame becomes the new reference. No moving average, no
# adaptive baseline, and never a sum across fingers.
#
# See handover/README.md for what has to be confirmed on the robot.

side: right                 # left | right. One node per hand.

# Detection-only is the default. While false the node constructs NO release
# client at all: it cannot open the hand and cannot ask the orchestrator to.
# Calibrate in this mode.
release_integration: false

rate: 30.0                  # Hz, detector tick; the framework describes ~30 Hz readings

# --- force input -------------------------------------------------------------------
# CONFIRMED 2026-10-14: the installed hand is a BrainCo Revo2 and the SDK and
# runtime are available. The hand MODEL is therefore no longer an open question.
#
# STILL DISABLED, because what is missing is the force SCHEMA, not the hardware:
#   * which SDK call returns force, and its field names and types;
#   * the channel -> finger mapping;
#   * the UNIT. A number from the device does not state its own unit, so this
#     cannot be inferred from observed values -- it needs vendor documentation
#     or a calibration. The 3 N threshold is uninterpretable until it is known.
#
# The intended source is the SDK directly (not a separate ROS tactile
# publisher). The fields below describe a ROS topic because that is the adapter
# that exists today; the SDK input boundary replaces `topic`/`message_type`
# without changing the channel table or the detection rule. Nothing below is a
# guess at real field names -- they are empty placeholders showing SHAPE only.
tactile:
  enabled: false
  topic: ""                 # e.g. /hand_right/tactile
  message_type: ""          # "pkg/Msg", imported at runtime
  stamp_field: ""           # optional dotted path to a seconds timestamp
  valid_field: ""           # optional dotted path to a per-frame validity flag
  expected_rate_hz: 30.0    # diagnostics only
  # One entry per scalar channel. `kind` decides how it may be compared:
  #   force_like  subtractable scalar, may be thresholded
  #   angular     an angle; differences are wrapped, not thresholded by default
  #   opaque      unknown units/sign; recorded but NEVER thresholded
  channels: []
  # channels:
  #   - {name: index_normal,  finger: index,  kind: force_like, field: "data[0]", unit: counts}
  #   - {name: index_tangent, finger: index,  kind: force_like, field: "data[1]", unit: counts}
  #   - {name: index_dir,     finger: index,  kind: angular,    field: "data[2]", unit: rad}
  #   - {name: index_prox,    finger: index,  kind: opaque,     field: "data[3]", unit: counts}

# --- detection ---------------------------------------------------------------------
# Both tables fall back to the detector's own per-channel defaults, so an empty
# table means "the requested setting for every enabled channel":
#
#   release_threshold  default 3.0  (tactile_detector.DEFAULT_RELEASE_THRESHOLD)
#   direction          default "either"  (compare the magnitude of the delta)
#
# THE 3 N THRESHOLD IS THE REQUESTED SETTING, NOT A MEASURED FIGURE. It is in
# whatever unit the SDK reports, and that unit is NOT yet confirmed: a number
# arriving from the device could be newtons, counts or a normalised fraction,
# and nothing on the device says which. Confirm the unit before trusting it.
calibration:
  enabled_channels: []      # channel mask; empty = every force_like channel
  release_threshold: {}     # channel -> delta that counts as a pull; empty = 3.0 each
  # channel -> rise | drop | either. This project's convention is a SIGNED delta
  # (new - reference): `rise` needs delta >= +threshold, `drop` needs
  # delta <= -threshold, `either` needs abs(delta) >= threshold. Which one a
  # human pull produces depends on how the hand's force channels are wired and
  # is UNCONFIRMED; "either" is the default because it cannot miss a real pull
  # by guessing the sign wrong. Set it explicitly once the SDK semantics are known.
  direction: {}

# --- arm settling ------------------------------------------------------------------
# The arm's own deceleration can produce a frame-to-frame force step that is not
# a human pull. The reference frame still advances while suppressed, so the step
# is absorbed instead of being re-detected when the window ends.
post_arm_suppress_sec: 1.0

# --- signal processing -------------------------------------------------------------
# A gap longer than this is a FAULT, never evidence: across a long gap two
# frames are no longer consecutive, so their delta means nothing.
sample_timeout_sec: 0.5
reference_timeout_sec: 10.0  # give up waiting for the first valid reference frame
monitor_timeout_sec: 120.0   # overall arm-to-trigger budget; 0 disables
