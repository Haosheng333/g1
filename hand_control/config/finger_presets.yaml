# Grip presets for the BrainCo Revo2 hand.
#
# Each preset becomes a std_srvs/Trigger service  /hand_{side}/<preset_name>
# (pre_grasp, grasp, release are REQUIRED - the orchestrator calls exactly these names).
#
# positions: 6 values, per-mille, SDK-native convention:
#     0 = fully OPEN      1000 = fully CLOSED
#     order: [thumb, thumb_aux, index, middle, ring, pinky]
#
# Optional per-preset keys (defaults in brackets):
#   settle_tolerance [40]    |feedback - target| <= this counts as "arrived"
#   settle_timeout_s [3.0]   stop waiting for arrival after this long
#   ramp_steps       [1]     real hand: split the move into N sub-steps (gentle closing)
#   ramp_dt          [0.05]  seconds between sub-steps
#   require_settle   [false] true -> service returns success=False if fingers did not arrive
#   expect_contact   [false] true -> success=False if NO finger was stopped short of its target
#                            (fingers closed all the way = grasped air). Turn on after calibrating.
#   min_contact_fingers [1]  how many fingers must be stopped short to count as "holding"

pre_grasp:
  positions: [0, 1000, 0, 0, 0, 0]
  ramp_steps: 3
  ramp_dt: 0.06
  settle_tolerance: 40
  settle_timeout_s: 3.0

grasp:
  positions: [500, 1000, 500, 500, 500, 500]
  ramp_steps: 5            # close in 5 steps (~0.3 s) instead of slamming shut
  ramp_dt: 0.08
  settle_tolerance: 40
  settle_timeout_s: 1.5    # a blocked finger never "arrives" - don't wait long
  require_settle: false    # fingers are SUPPOSED to be stopped by the bottle
  expect_contact: false    # set true once you've seen real feedback values with a bottle in hand
  min_contact_fingers: 1

release:
  positions: [180, 260, 140, 140, 140, 140]
  ramp_steps: 3
  ramp_dt: 0.05
  settle_tolerance: 40
  settle_timeout_s: 3.0
