# Vosk language/model selection. Pick ONE; a single Vosk model is
# language-specific, never bilingual (see README.md).
#
# English (default): the spoken fetch-and-deliver task is English
# ("go to the desk, pick up a can, go to the chair, and pass me, over"):
#   model_path: models/vosk-model-small-en-us-0.15
#   sample_rate: 16000
#
# Mandarin (the fixed phrases in commands.yaml also exist in Chinese):
#   model_path: models/vosk-model-small-cn-0.22
#   sample_rate: 16000
#
# Download with scripts/download_model.sh en|cn -- models are never fetched
# automatically by the node. When the lexicon is loaded the node also hands
# Vosk a GRAMMAR (the lexicon vocabulary + the fixed phrases), which makes the
# small model far more reliable on this vocabulary; ~use_grammar:=false
# restores free dictation.

language: en-us
model_path: models/vosk-model-small-en-us-0.15
sample_rate: 16000
