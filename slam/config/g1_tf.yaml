# =============================================================================
# G1 TF framework - static transform that attaches the robot to FAST-LIO2
# =============================================================================
#
# WHAT FAST-LIO2 ALREADY BROADCASTS
# --------------------------------------------------------------------------
# laserMapping.cpp (publish_odometry(), one tf::TransformBroadcaster) sends,
# every odometry cycle:
#
#       camera_init  --(dynamic)-->  body
#
#   camera_init : map / odometry origin, fixed at start
#   body        : FAST-LIO's tracked pose = the Mid-360 IMU frame
#
# TREE DIRECTION - READ CAREFULLY
# --------------------------------------------------------------------------
# In TF every frame has exactly ONE parent. `body` already has a parent
# (camera_init), so we must NOT publish anything -> body (that would give
# `body` two parents and break TF). Instead this transform hangs the robot
# base UNDER `body`:
#
#       camera_init --(FAST-LIO, dynamic)--> body --(this file, static)--> base_link
#
#   parent_frame = body        (owned by FAST-LIO)
#   child_frame  = base_link    (has no other parent -> conflict-free)
#
# So the six numbers below are the pose of `base_link` **expressed in the
# `body` (Mid-360 IMU) frame** - i.e. base_link-as-seen-from-the-IMU. That is
# the INVERSE of the intuitive "where is the LiDAR bolted on the robot"
# (base_link -> sensor) mounting pose. Measure base_link relative to the
# Mid-360 IMU directly, or measure the mounting pose and invert it.
#
# -----------------------------------------------------------------------------
#  !!! NOT MEASURED - DO NOT ENABLE AS-IS !!!
# -----------------------------------------------------------------------------
# Every translation and rotation value below is a ZERO PLACEHOLDER. Zeros
# assert that base_link coincides exactly with the Mid-360 IMU, which is
# wrong and would corrupt every downstream transform.
#
# Before setting `enabled: true` you MUST replace the placeholders with the
# real measured values. The offline health check
# (`slam_health_check.py --component tf`) fails if this file is enabled while
# the values are still all zero, and fails if the frames are wired in a way
# that would give any frame two parents.
# -----------------------------------------------------------------------------

# Master switch. Left false so the SLAM bring-up never publishes an unmeasured
# transform. Flip to true only after the values below are real.
enabled: false

# Parent frame: MUST be exactly `body` (FAST-LIO's tracked Mid-360 IMU frame).
# camera_init is rejected - it is the fixed world/map frame, and base_link is
# rigid to the sensor, not to the world. Setting base_link here is also
# rejected: it would invert the tree and give `body` a second parent.
parent_frame: body

# Child frame: the G1 base frame used across this repo. Must be a frame that
# nothing else parents.
child_frame: base_link

# ---- base_link expressed in `body` - PLACEHOLDERS, REQUIRE REAL MEASUREMENT ----
# Position of child_frame's origin in parent_frame, in metres.
translation:
  x: 0.0   # PLACEHOLDER - measure on the real robot
  y: 0.0   # PLACEHOLDER - measure on the real robot
  z: 0.0   # PLACEHOLDER - measure on the real robot

# Orientation of child_frame in parent_frame, in radians, applied as
# yaw (Z) then pitch (Y) then roll (X) - the same convention as
# tf2_ros static_transform_publisher.
rotation_rpy:
  roll: 0.0    # PLACEHOLDER - measure on the real robot
  pitch: 0.0   # PLACEHOLDER - measure on the real robot
  yaw: 0.0     # PLACEHOLDER - measure on the real robot
